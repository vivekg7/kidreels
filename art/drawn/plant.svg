  <path fill="#66BB6A" d="M116,222 C96,214 74,212 52,214 C74,218 96,220 116,224 Z"/>
  <path fill="#43A047" d="M124,196 C144,180 170,180 190,190 C170,206 142,208 124,200 Z"/>
  <path fill="#66BB6A" d="M124,198 C144,190 166,188 188,190 C166,194 144,196 124,200 Z"/>
  <path fill="#43A047" d="M116,150 C98,134 76,132 58,140 C76,156 100,158 116,154 Z"/>
