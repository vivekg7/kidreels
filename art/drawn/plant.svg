<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360">
  <!--
    A plant with the ground cut away, so the roots show: for "Tap the root!" and for the
    photosynthesis animation, which draws the sun, water and air over it. Where each part
    is lives in core/Diagrams.kt, in this drawing's units.
  -->
